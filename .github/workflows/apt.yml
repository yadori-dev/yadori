name: apt 配布

on:
  pull_request:
    paths: ['packaging/apt/**', '.github/workflows/apt.yml', 'pyproject.toml', 'uv.lock', 'backend/src/**', 'assets/branding/yadori-icon-v2.png']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Release タグと製品版を確認する
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 版を選ぶ入口を検査する
        run: bash packaging/apt/test-version.sh
      - name: 今回配る版を決める
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          test "$PRERELEASE" != true
          version=$(bash packaging/apt/version.sh "$RELEASE_TAG")
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {image: 'ubuntu:24.04', suite: noble}
          - {image: 'debian:13-slim', suite: trixie}
    steps:
      - uses: actions/checkout@v5
      - name: 配布物を作る
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.value }}
        run: docker build --build-arg BASE_IMAGE="$IMAGE" --build-arg PACKAGE_VERSION="$VERSION" --target package --output type=local,dest=packages -f packaging/apt/Dockerfile .
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.suite }}
          path: packages/*.deb
          retention-days: 7

  verify:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: packages
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Ubuntu の検査環境を用意する
        run: docker build --target os -t yadori-test-ubuntu -f packaging/apt/Dockerfile .
      - name: 署名・導入・更新・削除を確かめる
        env:
          APT_TEST_NETWORK: host
          APT_UBUNTU_IMAGE: yadori-test-ubuntu
        run: bash packaging/apt/test.sh packages

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [version, verify]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: apt-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 発行されたタグと最新の正式版を確認する
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bash packaging/apt/version.sh "$RELEASE_TAG"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: packages
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: 署名した配布元を作る
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          bash packaging/apt/repository.sh packages public "$APT_SIGNING_FINGERPRINT"
      - name: 同じ配布物を発行済み Release に添付する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/*.deb --clobber
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
