[project]
name = "yadori"
version = "0.0.0"
description = "続く記憶と気持ちを持ち、話しかけられていない間も動く常駐プログラム"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "basedpyright>=1.39",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/yadori"]
artifacts = ["backend/src/yadori/py.typed"]

[tool.ruff]
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
# 文書文字列とコメントは日本語で書く。全角の記号は表記であって曖昧さではない。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
include = ["backend"]
extraPaths = ["backend/src", "backend"]
failOnWarnings = true

# テストは pytest の作法に従う。呼び出しの結果を使わないこと、置き換えた実装が
# 引数を使わないこと、テスト対象の内側を覗くことは、テストでは普通である。
[[tool.basedpyright.executionEnvironments]]
root = "backend/tests"
reportUnusedCallResult = "none"
reportUnusedParameter = "none"
reportPrivateUsage = "none"

[tool.pytest.ini_options]
pythonpath = ["backend/src", "backend"]
markers = [
    "contract: 外部の実物に当てる契約テスト。通常の実行から分ける",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]
