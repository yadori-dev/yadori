[project]
name = "yadori"
version = "0.0.0"
description = "続く記憶と気持ちを持ち、話しかけられていない間も動く常駐プログラム"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/yadori"]

[tool.ruff]
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
# 文書文字列とコメントは日本語で書く。全角の記号は表記であって曖昧さではない。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
mypy_path = "backend/src"

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
markers = [
    "contract: 外部の実物に当てる契約テスト。通常の実行から分ける",
]
