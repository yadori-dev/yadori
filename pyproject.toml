[project]
name = "yadori"
version = "0.0.0"
description = "続く記憶と気持ちを持ち、話しかけられていない間も動く常駐プログラム"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "basedpyright>=1.39",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/yadori"]
artifacts = ["backend/src/yadori/py.typed"]

[tool.ruff]
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
# 文書文字列とコメントは日本語で書く。全角の記号は表記であって曖昧さではない。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.basedpyright]
pythonVersion = "3.12"
# 最も厳しい設定を使う。編集環境がこれで動くため、緩めると手元と検査が
# 食い違い、片方だけが通る状態に戻る。
typeCheckingMode = "all"
include = ["backend", "scripts"]
extraPaths = ["backend/src", "backend"]
# 編集環境が同じ環境を見るように、置き場をここに書く。書かないと外部の
# パッケージを解決できず、身に覚えのない指摘が大量に出る。
venvPath = "."
venv = ".venv"
failOnWarnings = true

[tool.pytest.ini_options]
pythonpath = ["backend/src", "backend"]
markers = [
    "contract: 外部の実物に当てる契約テスト。通常の実行から分ける",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]
